<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Zcode Mobile 审核演示工作区</title>
  <style>
    :root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:#0b0e14;color:#eef2fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 90% 0,rgba(42,115,255,.22),transparent 36rem),#0b0e14}.shrink-0.border-b.border-border.bg-header.px-4.py-3{height:72px;display:flex;align-items:center;padding:0 18px;border-bottom:1px solid #252b38;background:#11151d;font-weight:650}.workspace{max-width:820px;margin:0 auto;padding:24px 16px 54px}.badge{display:inline-flex;padding:7px 11px;border-radius:999px;background:#153629;color:#6de0a4;font-size:13px}.intro{margin:18px 0 22px;padding:24px;border:1px solid #252c39;border-radius:22px;background:rgba(20,25,35,.88)}h1{font-size:28px;margin:0 0 10px}p{color:#aeb7c7;line-height:1.65}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{padding:18px;border:1px solid #252c39;border-radius:18px;background:#121722}.card strong{display:block;margin-bottom:7px}.card span{color:#8e99ab;font-size:14px}.composer{position:sticky;bottom:10px;margin-top:22px;padding:10px;border:1px solid #303746;border-radius:18px;background:rgba(22,27,37,.94);backdrop-filter:blur(16px);display:flex;gap:8px}input{min-width:0;flex:1;border:0;background:transparent;color:white;font:inherit;padding:9px;outline:none}button{border:0;border-radius:12px;padding:0 16px;background:linear-gradient(145deg,#29caf1,#4168ff);color:white;font:inherit;font-weight:700}.notice{display:none;margin-top:12px;color:#71dda7}@media(max-width:580px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header class="shrink-0 border-b border-border bg-header px-4 py-3">ZCode 远程控制 已连接到当前桌面窗口</header>
  <main class="workspace" role="main">
    <span class="badge">审核演示连接正常</span>
    <section class="intro"><h1>Zcode Mobile 公开审核工作区</h1><p>这是一个不包含用户数据的交互式兼容页面，用于帮助 App Review 验证扫码、相册导入、连接验证、网页显示、刷新和断开连接。正式使用时，用户连接的是自己电脑上运行的 ZCode 工作区。</p></section>
    <section class="grid">
      <button class="card" type="button" onclick="show('已打开示例任务')"><strong>示例任务</strong><span>验证工作区按钮交互</span></button>
      <button class="card" type="button" onclick="show('刷新动作已验证')"><strong>连接状态</strong><span>公开演示 · 无需登录</span></button>
      <div class="card"><strong>隐私状态</strong><span>无账号、无广告、无跟踪</span></div>
      <div class="card"><strong>测试范围</strong><span>扫码、显示、刷新与断开</span></div>
    </section>
    <p id="notice" class="notice" aria-live="polite"></p>
    <form class="composer" onsubmit="event.preventDefault();show('输入交互已验证');this.reset()"><input aria-label="演示输入" placeholder="输入任意文字测试工作区…"><button type="submit">发送</button></form>
  </main>
  <script>function show(message){const el=document.getElementById('notice');el.textContent=message;el.style.display='block'}</script>
</body>
</html>
